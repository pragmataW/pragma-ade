appId: dev.pragma.ade
productName: Pragma ADE
copyright: Copyright © 2026 pragmataW
asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false
publish: null
artifactName: pragma-ade-${version}-${os}-${arch}.${ext}
files: ["out/**", "package.json", "node_modules/**"]
mac:
  {
    category: public.app-category.developer-tools,
    target: [dmg, zip],
    icon: build/icon.icns,
    identity: "-",
    hardenedRuntime: false,
    gatekeeperAssess: false,
  }
dmg: { writeUpdateInfo: false }
linux:
  {
    target: [AppImage, deb],
    icon: build/icons,
    executableName: pragma-ade,
    category: Development,
    synopsis: Agentic development environment,
    maintainer: "pragmataW <92221201+pragmataW@users.noreply.github.com>",
  }
win: { target: [nsis, zip], icon: build/icon.ico, signExecutable: false }
nsis:
  {
    oneClick: false,
    perMachine: false,
    allowToChangeInstallationDirectory: true,
    differentialPackage: false,
    artifactName: "pragma-ade-${version}-win-${arch}-setup.${ext}",
  }
